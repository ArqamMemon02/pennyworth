; Pennyworth — PlatformIO project
; See CLAUDE.md for hardware details and roadmap.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.psram_type = opi
build_src_filter = +<*> -<main_native.cpp>
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps = lvgl/lvgl@^9.6.0

[env:native]
platform = native
build_src_filter = +<*> -<main_esp32.cpp>
build_flags =
    -Iinclude
    -std=gnu++17
    -DPENNYWORTH_SIMULATOR
    -DLV_CONF_INCLUDE_SIMPLE
    !pkg-config --cflags --libs sdl2
lib_deps = lvgl/lvgl@^9.6.0
