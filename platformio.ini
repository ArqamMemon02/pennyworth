; Pennyworth — PlatformIO project
; See CLAUDE.md for hardware details and roadmap.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DPENNYWORTH_SIMULATOR
